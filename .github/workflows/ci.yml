name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  aggregator-and-edge:
    name: Aggregator and edge collectors
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install CI toolchain
        uses: Skrates/agent-affordances/toolchain@5330262b47f3a4b79ca129ee9e27e96b6707713d
        with:
          tools: bun

      - name: Test and type-check aggregator
        working-directory: aggregator
        run: |
          bun install --frozen-lockfile
          bun test
          bun run check

      - name: Test edge collectors
        working-directory: edge
        run: python3 -m unittest -v

      - name: ShellCheck installers and wrappers
        run: shellcheck edge/install-*.sh edge/*.sh

  apple:
    name: Swift package and Apple builds
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Test UsageKit
        working-directory: UsageKit
        run: swift test

      - name: Verify Release entitlement build settings
        run: .github/scripts/check-release-build-settings.sh

      - name: Build iOS Simulator app and widget
        run: |
          xcodebuild \
            -project ClaudeSwifties.xcodeproj \
            -scheme ClaudeSwifties \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-iOS" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build macOS release app and widget
        run: |
          xcodebuild \
            -project ClaudeSwifties.xcodeproj \
            -scheme ClaudeSwifties \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-macOS" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Sign release artifact with target entitlements
        run: .github/scripts/sign-release-for-entitlement-check.sh "$RUNNER_TEMP/DerivedData-macOS"

      - name: Verify signed release entitlements
        run: .github/scripts/check-release-entitlements.sh "$RUNNER_TEMP/DerivedData-macOS"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Gitleaks
        uses: Skrates/agent-affordances/toolchain@5330262b47f3a4b79ca129ee9e27e96b6707713d
        with:
          tools: gitleaks

      - name: Scan with Gitleaks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            gitleaks git --redact --log-opts="$BASE_SHA..$HEAD_SHA"
          else
            gitleaks git --redact
          fi
